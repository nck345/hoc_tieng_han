function clean(s) {
    if (!s) return "";
    return s.replace(/\s+/g, ' ').trim();
}

function cleanOption(opt) {
    if (!opt) return "";
    let s = opt.replace(/^[①②③④❶❷❸❹㉦㉣㉨㉭㉠㉡㉢㉣@\(\d\)\s\.\,]+/, '');
    s = s.split(/\s+(?:TOPIK\s*MASTER|문제집|실전\s*모의고사|해설|단어|Exp|종류|어휘)/i)[0];
    return clean(s);
}

async function run() {
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const targetExam = urlParams.get('exam') || 'hot01';
        
        const isTM = targetExam.startsWith('tm');
        const numStr = targetExam.slice(-2);
        const numInt = parseInt(numStr);
        const examId = isTM ? `tm_${numStr}` : `hot_${numStr}`;
        const examCategory = isTM ? 'topik_master' : 'hot_topik';
        const audioFolder = isTM 
            ? `de/TOPIK MASTER/TOPIK MASTER_ĐỀ ${numStr}/audio`
            : `de/Hot topik/HOT TOPIK ĐỎ 2020 ĐỀ ${numStr}/audio`;
            
        const ansFile = `${targetExam}_ans_full.txt`;
        const deFile = `${targetExam}_de_full.txt`;
        
        const respAns = await fetch(ansFile);
        const ansRaw = await respAns.text();
        const respDe = await fetch(deFile);
        const deRaw = await respDe.text();
        
        const ansPages = ansRaw.split(/=== PAGE \d+ ===/).map(p => p.trim()).filter(Boolean);
        const dePages = deRaw.split(/=== PAGE \d+ ===/).map(p => p.trim()).filter(Boolean);
        
        const listeningAnsAnswers = ANSWERS[`${targetExam}_l`];
        const readingAnsAnswers = ANSWERS[`${targetExam}_r`];
        
        // --- PARSE 50 LISTENING QUESTIONS ---
        const listeningQuestions = [];
        for (let q = 1; q <= 50; q++) {
            const qNumStr = String(q).padStart(2, '0');
            const inst = getInstruction(q, 'listening');
            const ans = listeningAnsAnswers ? listeningAnsAnswers[q - 1] : 1;
            
            // Search for dialogue in ansRaw
            let passage = "";
            let trans = [];
            const qMatch = ansRaw.match(new RegExp(`(?:^|\\n)\\s*${q}\\.\\s*([\\s\\S]*?)(?=(?:\\n\\s*${q+1}\\.\\s*|===|\\[\\d+~|$))`));
            if (qMatch) {
                const diaMatch = qMatch[1].match(/(?:여자|남자)\s*:[\s\S]*?(?=(?:종류|해설|단어|어휘|Part|\(?\d\)?|[①②③④❶❷❸❹㉦㉣㉨㉭㉠㉡㉢㉣@]|$))/);
                if (diaMatch) {
                    passage = clean(diaMatch[0]);
                }
            }
            if (!passage) {
                // Look for dialogue turn with speaker tags
                const spkMatch = ansRaw.match(new RegExp(`(?:^|\\n)\\s*${q}\\.[^\\n]*\\n((?:여자|남자)[\\s\\S]*?)(?=(?:\\n\\s*\\d+\\.|===|$))`));
                if (spkMatch) passage = clean(spkMatch[1]);
            }
            if (!passage) passage = `대화 내용 ${q}번`;
            
            // Extract transcript speaker turns
            const spkRegex = /(여자|남자)\s*:\s*([^여자남자\n\r]+)/g;
            let sm;
            while ((sm = spkRegex.exec(passage)) !== null) {
                trans.push({ speaker: sm[1], text: clean(sm[2]) });
            }
            if (trans.length === 0) {
                trans = [{ speaker: "대화", text: passage }];
            }
            
            // Extract options from dePages
            let options = [];
            if (q === 1) {
                options = ["[Tranh 1] Lựa chọn 1", "[Tranh 2] Lựa chọn 2", "[Tranh 3] Lựa chọn 3", "[Tranh 4] Lựa chọn 4"];
            } else if (q === 2) {
                options = ["[Tranh 1] Lựa chọn 1", "[Tranh 2] Lựa chọn 2", "[Tranh 3] Lựa chọn 3", "[Tranh 4] Lựa chọn 4"];
            } else if (q === 3) {
                options = ["[Biểu đồ 1] Lựa chọn 1", "[Biểu đồ 2] Lựa chọn 2", "[Biểu đồ 3] Lựa chọn 3", "[Biểu đồ 4] Lựa chọn 4"];
            } else {
                // Find in deRaw
                const qDeMatch = deRaw.match(new RegExp(`(?:^|\\n)\\s*${q}\\.\\s*([\\s\\S]*?)(?=(?:\\n\\s*${q+1}\\.\\s*|===|\\[\\d+~|$))`));
                if (qDeMatch) {
                    const reg = /(?:[①②③④❶❷❸❹㉦㉣㉨㉭㉠㉡㉢㉣@]|\(\s*[0-9\uAE30\uC774\uC804\uACFC\uC384]\s*\))\s*([^①②③④❶❷❸❹㉦㉣㉨㉭㉠㉡㉢㉣@\(\n\r]+)/g;
                    let om;
                    while ((om = reg.exec(qDeMatch[1])) !== null) {
                        const opt = cleanOption(om[1]);
                        if (opt.length > 1) options.push(opt);
                        if (options.length === 4) break;
                    }
                }
            }
            if (options.length < 4) {
                // Fallback to sentence split in deRaw
                const deBlock = deRaw.slice(Math.max(0, deRaw.indexOf(`${q}.`)), deRaw.indexOf(`${q+1}.`));
                const sents = deBlock.split(/(?<=[다요죠\?][\.\,])\s+/).map(cleanOption).filter(s => s.length > 2 && !s.includes('고르십시오'));
                options = sents.slice(0, 4);
            }
            while (options.length < 4) {
                options.push(`선택지 ${options.length + 1}`);
            }
            
            listeningQuestions.push({
                id: `${targetExam}_l_${qNumStr}`,
                examId: examId,
                examCategory: examCategory,
                section: "listening",
                questionNumber: q,
                instruction: inst,
                passage: passage,
                audioUrl: `${audioFolder}/q${qNumStr}.mp3`,
                options: options,
                correctAnswer: ans,
                explanation: `정답: ${ans}번`,
                transcript: trans,
                vocabulary: []
            });
        }
        
        // --- PARSE 50 READING QUESTIONS ---
        const readingQuestions = [];
        for (let q = 1; q <= 50; q++) {
            const qNumStr = String(q).padStart(2, '0');
            const inst = getInstruction(q, 'reading');
            const ans = readingAnsAnswers ? readingAnsAnswers[q - 1] : 1;
            
            // Search reading passage in deRaw or ansRaw
            let passage = "";
            let options = [];
            
            // In Reading, find question in deRaw
            const qIdx = deRaw.indexOf(`읽기`);
            const rDeTxt = qIdx >= 0 ? deRaw.slice(qIdx) : deRaw;
            const qMatch = rDeTxt.match(new RegExp(`(?:^|\\n)\\s*${q}\\.\\s*([\\s\\S]*?)(?=(?:\\n\\s*${q+1}\\.\\s*|===|\\[\\d+~|$))`));
            if (qMatch) {
                const blk = qMatch[1];
                // Separate passage and options
                const optStart = blk.search(/[①②③④❶❷❸❹㉦㉣㉨㉭㉠㉡㉢㉣@]|\(\s*[0-9\uAE30\uC774\uC804\uACFC\uC384]\s*\)/);
                if (optStart > 0) {
                    passage = clean(blk.slice(0, optStart));
                    const optText = blk.slice(optStart);
                    const reg = /(?:[①②③④❶❷❸❹㉦㉣㉨㉭㉠㉡㉢㉣@]|\(\s*[0-9\uAE30\uC774\uC804\uACFC\uC384]\s*\))\s*([^①②③④❶❷❸❹㉦㉣㉨㉭㉠㉡㉢㉣@\(\n\r]+)/g;
                    let om;
                    while ((om = reg.exec(optText)) !== null) {
                        const opt = cleanOption(om[1]);
                        if (opt.length > 1) options.push(opt);
                        if (options.length === 4) break;
                    }
                } else {
                    passage = clean(blk);
                }
            }
            if (!passage) passage = `지문 내용 ${q}번`;
            while (options.length < 4) {
                options.push(`선택지 ${options.length + 1}`);
            }
            
            readingQuestions.push({
                id: `${targetExam}_r_${qNumStr}`,
                examId: examId,
                examCategory: examCategory,
                section: "reading",
                questionNumber: q,
                instruction: inst,
                passage: passage,
                audioUrl: null,
                options: options,
                correctAnswer: ans,
                explanation: `정답: ${ans}번`,
                transcript: [],
                vocabulary: []
            });
        }
        
        const finalJson = {
            examId: examId,
            examCategory: examCategory,
            listening: listeningQuestions,
            reading: readingQuestions
        };
        
        document.getElementById('output').textContent = JSON.stringify(finalJson);
    } catch(e) {
        document.getElementById('output').textContent = "ERROR: " + e.message + "\n" + e.stack;
    }
}
window.onload = run;
</script>
