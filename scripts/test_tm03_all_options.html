<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<pre id="output">STARTING</pre>
<script>
function clean(s) {
    if (!s) return "";
    return s.replace(/\s+/g, ' ').trim();
}

function cleanOption(opt) {
    if (!opt) return "";
    let s = opt.replace(/^[①②③④❶❷❸❹㉦㉣㉨㉭㉠㉡㉢㉣@\(\d\)\s\.\,]+/, '');
    s = s.split(/\s+(?:TOPIK\s*MASTER|문제집|실전\s*모의고사)/i)[0];
    return clean(s);
}

function extractOptionsFromPage(pageText) {
    let txt = pageText.replace(/TOPIK MASTER.*|문제집.*|- 실전 모의고사.*/g, '');
    txt = txt.replace(/※?\s*\[\d+~\d+\][^\)]*\)/g, '');
    txt = txt.replace(/^\s*(?:\d+\.\s*)+/g, ''); // strip top question numbers
    
    // Split by either circled bullet OR Korean sentence end (다/요/죠 followed by dot/comma/newline)
    const rawTokens = txt.split(/(?:[①②③④❶❷❸❹㉦㉣㉨㉭㉠㉡㉢㉣@]|\(\s*[0-9\uAE30\uC774\uC804\uACFC\uC384]\s*\)|(?<=[다요죠\?][\.\,])\s+)/);
    const items = [];
    for (let t of rawTokens) {
        let opt = cleanOption(t);
        if (opt.length > 2 && !opt.includes('고르십시오') && !opt.includes('물음에 답하십시오') && !opt.includes('맞는 것을') && !opt.includes('알맞은 것을') && !opt.includes('일치하는 것을')) {
            items.push(opt);
        }
    }
    return items;
}

async function run() {
    try {
        const respDe = await fetch("tm03_de_full.txt");
        const deRaw = await respDe.text();
        const pages = deRaw.split(/=== PAGE \d+ ===/);
        
        // Listening pages mapping:
        // Page 4: Q4, Q5 (2 questions * 4 = 8 options)
        // Page 5: Q6..Q10 (5 * 4 = 20)
        // Page 6: Q11..Q15 (5 * 4 = 20)
        // Page 7: Q16..Q20 (5 * 4 = 20)
        // Page 8: Q21..Q24 (4 * 4 = 16)
        // Page 9: Q25..Q28 (4 * 4 = 16)
        // Page 10: Q29..Q32 (4 * 4 = 16)
        // Page 11: Q33..Q36 (4 * 4 = 16)
        // Page 12: Q37..Q40 (4 * 4 = 16)
        // Page 13: Q41..Q44 (4 * 4 = 16)
        // Page 14: Q45..Q48 (4 * 4 = 16)
        // Page 15: Q49..Q50 (2 * 4 = 8)
        
        const pageConfigs = [
            { page: 4, questions: [4, 5] },
            { page: 5, questions: [6, 7, 8, 9, 10] },
            { page: 6, questions: [11, 12, 13, 14, 15] },
            { page: 7, questions: [16, 17, 18, 19, 20] },
            { page: 8, questions: [21, 22, 23, 24] },
            { page: 9, questions: [25, 26, 27, 28] },
            { page: 10, questions: [29, 30, 31, 32] },
            { page: 11, questions: [33, 34, 35, 36] },
            { page: 12, questions: [37, 38, 39, 40] },
            { page: 13, questions: [41, 42, 43, 44] },
            { page: 14, questions: [45, 46, 47, 48] },
            { page: 15, questions: [49, 50] }
        ];
        
        const results = {};
        for (const cfg of pageConfigs) {
            const rawOpts = extractOptionsFromPage(pages[cfg.page]);
            results[`p${cfg.page}_q${cfg.questions.join('_')}`] = {
                expected: cfg.questions.length * 4,
                found: rawOpts.length,
                sample: rawOpts.slice(0, 4)
            };
        }
        
        document.getElementById('output').textContent = JSON.stringify(results, null, 2);
    } catch(e) {
        document.getElementById('output').textContent = "ERROR: " + e.message;
    }
}
window.onload = run;
</script>
</body>
</html>
