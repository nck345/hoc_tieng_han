<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>
    <iframe id="appFrame" src="../index.html" style="width:1200px;height:800px;"></iframe>
    <pre id="results">RUNNING</pre>
    <script>
    window.addEventListener('load', () => {
        setTimeout(async () => {
            const results = [];
            const doc = document.getElementById('appFrame').contentDocument;
            const win = document.getElementById('appFrame').contentWindow;
            const app = win.app;
            
            try {
                // Test 1: Category & Questions in Data
                const cat = win.EXAM_DATA.categories.find(c => c.id === 'hot_topik');
                results.push('Test 1 - Category found: ' + (cat ? 'PASS (' + cat.name + ')' : 'FAIL'));
                
                const hot05Qs = win.EXAM_DATA.questions.filter(q => q.examId === 'hot_05');
                const hot05L = hot05Qs.filter(q => q.section === 'listening');
                const hot05R = hot05Qs.filter(q => q.section === 'reading');
                results.push('Test 2 - Questions count hot_05: Total=' + hot05Qs.length + ' L=' + hot05L.length + ' R=' + hot05R.length + 
                    (hot05L.length === 50 && hot05R.length === 50 ? ' PASS' : ' FAIL'));
                
                const hot01Qs = win.EXAM_DATA.questions.filter(q => q.examId === 'hot_01');
                const hot01L = hot01Qs.filter(q => q.section === 'listening');
                const hot01R = hot01Qs.filter(q => q.section === 'reading');
                results.push('Test 2b - Questions count hot_01: Total=' + hot01Qs.length + ' L=' + hot01L.length + ' R=' + hot01R.length +
                    (hot01L.length === 50 && hot01R.length === 50 ? ' PASS' : ' FAIL'));
                
                // Test 3: Check authentic Hot Topik Listening content (Q1 Kim Ji-min)
                const q1 = hot05L[0];
                const isJiMin = q1.passage.indexOf('김지민') >= 0;
                results.push('Test 3 - Authentic Hot Topik Listening Q1 (Kim Ji-min): ' + (isJiMin ? 'PASS' : 'FAIL'));
                results.push('Test 3b - Audio path: ' + (q1.audioUrl.indexOf('audio/q01.mp3') >= 0 ? 'PASS (' + q1.audioUrl + ')' : 'FAIL'));
                results.push('Test 3c - Correct Answer Q1: ' + (q1.correctAnswer === 2 ? 'PASS (ans=2)' : 'FAIL'));
                
                // Q29 Asiad Soccer coach
                const q29 = hot05L[28];
                const isCoach = q29.options.some(o => o.indexOf('축구 감독') >= 0);
                results.push('Test 3d - Authentic Hot Topik Listening Q29 (soccer coach): ' + (isCoach && q29.correctAnswer === 3 ? 'PASS' : 'FAIL'));
                
                // Test 4: Check authentic Hot Topik Reading content (Q1 -고자, Q42 Soonam)
                const rq1 = hot05R[0];
                const isGojah = rq1.options.some(o => o.indexOf('도착하고자') >= 0);
                results.push('Test 4 - Authentic Hot Topik Reading Q1 (-고자): ' + (isGojah && rq1.correctAnswer === 3 ? 'PASS' : 'FAIL'));
                
                const rq42 = hot05R[41];
                const isSoonam = rq42.passage.indexOf('수남') >= 0 && rq42.options.some(o => o.indexOf('섭섭하다') >= 0);
                results.push('Test 4b - Authentic Hot Topik Reading Q42 (Soonam): ' + (isSoonam && rq42.correctAnswer === 1 ? 'PASS' : 'FAIL'));
                
                // Test 5: Switch to Exam View & Select Hot Topik Category
                app.switchView('exam');
                app.currentExamCategory = cat;
                app.renderExamView();
                
                const folderTitle = doc.getElementById('exam-folder-detail-title');
                results.push('Test 5 - Folder detail title: ' + (folderTitle && folderTitle.textContent.indexOf('HOT TOPIK') >= 0 ? 'PASS' : 'FAIL'));
                
                // Test 6: Check Part 1 Nghe and Part 2 Doc buttons in detail grid
                const card = doc.querySelector('.exam-card');
                const listenBtn = card ? card.querySelector('.btn-part-listen') : null;
                const readBtn = card ? card.querySelector('.btn-part-read') : null;
                results.push('Test 6 - Part buttons rendered: ' + (listenBtn && readBtn ? 'PASS' : 'FAIL'));
                
                // Test 7: Start Listening Part
                listenBtn.click();
                results.push('Test 7 - Active player displayed: ' + (app.examEls.activePlayer.style.display !== 'none' ? 'PASS' : 'FAIL'));
                results.push('Test 7b - Questions loaded in active exam: ' + (app.activeExamQuestions.length === 50 ? 'PASS (50 questions)' : 'FAIL (' + app.activeExamQuestions.length + ')'));
                
                // Test 8: Subtitle visibility before answer submission
                const solPanel = app.examEls.solutionPanel;
                const solHiddenBefore = solPanel && (solPanel.style.display === 'none' || solPanel.classList.contains('hidden'));
                results.push('Test 8 - Solution & subtitles hidden before answer: ' + (solHiddenBefore ? 'PASS' : 'FAIL'));
                
                // Test 9: Select option 2 and submit answer
                const optBtns = app.examEls.qOptionsList.querySelectorAll('.option-btn');
                if (optBtns.length >= 4) {
                    optBtns[1].click(); // Option 2
                    app.examEls.btnSubmitAns.click();
                    
                    const solVisibleAfter = solPanel && (solPanel.style.display === 'block' || !solPanel.classList.contains('hidden'));
                    results.push('Test 9 - Solution & subtitles revealed after submission: ' + (solVisibleAfter ? 'PASS' : 'FAIL'));
                } else {
                    results.push('Test 9 - Option buttons count error: FAIL (count=' + optBtns.length + ')');
                }
                
                // Test 10: Exit exam and verify no progress saved
                app.examEls.btnPlayerBack.click();
                results.push('Test 10 - Exited back to folder: ' + (app.examEls.activePlayer.style.display === 'none' ? 'PASS' : 'FAIL'));
                
                // Re-enter listening exam - must start fresh at question 1 (index 0)
                listenBtn.click();
                results.push('Test 10b - Re-entry starts at Question 1 (index=0): ' + (app.activeExamQuestionIndex === 0 ? 'PASS' : 'FAIL'));
                
                // Test 11: Final Score and result modal upon completion
                // Answer question 1..50 and submit the exam
                for (let i = 0; i < app.activeExamQuestions.length; i++) {
                    const qId = app.activeExamQuestions[i].id;
                    app.currentSessionAnswers[qId] = {
                        userAnswer: 2,
                        isCorrect: (app.activeExamQuestions[i].correctAnswer === 2)
                    };
                }
                // Set question index to last question
                app.activeExamQuestionIndex = app.activeExamQuestions.length - 1;
                app.nextExamQuestion(); // triggers finish!
                
                const scoreRecord = app.storage.getExamScore('hot_01', 'listening');
                results.push('Test 11 - Final score stored in storage: ' + (scoreRecord && scoreRecord.total === 50 ? 'PASS (correct=' + scoreRecord.correctCount + '/50)' : 'FAIL'));
                
                const modal = doc.getElementById('exam-result-modal');
                const modalVisible = modal && modal.classList.contains('active');
                results.push('Test 12 - Result modal displayed with score: ' + (modalVisible ? 'PASS' : 'FAIL'));
                
            } catch(e) {
                results.push('EXCEPTION: ' + e.message + ' ' + e.stack);
            }
            
            document.getElementById('results').textContent = results.join('\n');
            console.error('VERIFY_SUMMARY:\n' + results.join('\n'));
        }, 1500);
    });
    </script>
</body>
</html>
