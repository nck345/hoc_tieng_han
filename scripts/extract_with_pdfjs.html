<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="lib/pdf.min.js"></script>
</head>
<body>
    <div id="output">Running...</div>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
        
        async function run() {
            try {
                const pdfUrl = '../de/TOPIK MASTER/TOPIK MASTER_ĐỀ 01/TOPIK MASTER_ĐỀ 01_Đọc chi tiết.pdf';
                const resp = await fetch(pdfUrl);
                const arrayBuf = await resp.arrayBuffer();
                console.error("FETCHED_BYTES: " + arrayBuf.byteLength);

                const loadingTask = pdfjsLib.getDocument({ data: arrayBuf });
                const pdf = await loadingTask.promise;
                console.error("PDF_PAGES: " + pdf.numPages);
                
                for(let p = 1; p <= Math.min(5, pdf.numPages); p++) {
                    const page = await pdf.getPage(p);
                    const textContent = await page.getTextContent();
                    const text = textContent.items.map(item => item.str).join(' ');
                    console.error("PAGE_" + p + ": " + text.slice(0, 300));
                }
                document.getElementById("output").textContent = "DONE";
            } catch(e) {
                console.error("EXTRACT_ERROR: " + e.message + " " + e.stack);
            }
        }
        run();
    </script>
</body>
</html>
